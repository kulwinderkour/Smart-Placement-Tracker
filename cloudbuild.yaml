# ═══════════════════════════════════════════════════════════════════════════════
# Cloud Build — Git-triggered CI/CD for Smart Placement Tracker
# Trigger: push to main branch (kulwinderkour/Smart-Placement-Tracker)
# Project: smart-placement-prod (asia-south1)
# Account: amswami9273@gmail.com
# ═══════════════════════════════════════════════════════════════════════════════
#
# HOW TO CREATE THE TRIGGER (run once):
#   gcloud builds triggers create github \
#     --name=deploy-on-main \
#     --repo-name=Smart-Placement-Tracker \
#     --repo-owner=kulwinderkour \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml \
#     --project=smart-placement-prod \
#     --region=global
#
# REQUIRED SECRETS IN SECRET MANAGER (create once):
#   backend-database-url      — full asyncpg DATABASE_URL
#   backend-jwt-secret        — JWT secret
#   backend-gemini-key        — Gemini API key
#   backend-google-client-id  — Google OAuth client ID
#   backend-google-client-secret — Google OAuth secret
#   backend-upstash-url       — Upstash Redis REST URL
#   backend-upstash-token     — Upstash Redis REST token
#   firebase-ci-token         — from: firebase login:ci
#
steps:
  # ── Step 1: Build backend Docker image ─────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api:latest'
      - '-f'
      - 'backend-api/Dockerfile'
      - 'backend-api'

  # ── Step 2: Push image to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api'
    waitFor: ['build-backend']

  # ── Step 3: Deploy backend to Cloud Run ────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend-api'
      - '--image=asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--port=8000'
      - '--set-secrets=DATABASE_URL=backend-database-url:latest,JWT_SECRET=backend-jwt-secret:latest,GEMINI_API_KEY=backend-gemini-key:latest,GOOGLE_CLIENT_ID=backend-google-client-id:latest,GOOGLE_CLIENT_SECRET=backend-google-client-secret:latest,UPSTASH_REDIS_REST_URL=backend-upstash-url:latest,UPSTASH_REDIS_REST_TOKEN=backend-upstash-token:latest'
      - >-
        --update-env-vars=FRONTEND_URL=https://smart-placement-trackerr.web.app,
        GOOGLE_REDIRECT_URI=https://backend-api-385144446825.asia-south1.run.app/api/v1/auth/google/callback,
        GCS_BUCKET_NAME=smart-placement-resumes-prod,
        GCS_PROJECT_ID=smart-placement-prod
      - '--add-cloudsql-instances=smart-placement-prod:asia-south1:smart-placement-db'
      - '--quiet'
    waitFor: ['push-backend']

  # ── Step 4: Build frontend (runs in parallel with backend build) ────────────
  - name: 'node:20-slim'
    id: 'build-frontend'
    entrypoint: bash
    args:
      - '-c'
      - |
        cd frontend
        npm ci
        VITE_API_URL=https://backend-api-385144446825.asia-south1.run.app/api/v1 \
        VITE_AI_URL=https://ai-engine-385144446825.asia-south1.run.app \
        VITE_AI_ENGINE_URL=https://ai-engine-385144446825.asia-south1.run.app \
        npm run build
    waitFor: ['-']

  # ── Step 5: Deploy frontend to Firebase Hosting ────────────────────────────
  - name: 'node:20-slim'
    id: 'deploy-frontend'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        cd frontend
        firebase deploy --only hosting \
          --project smart-placement-trackerr \
          --token "$$FIREBASE_TOKEN" \
          --non-interactive
    secretEnv: ['FIREBASE_TOKEN']
    waitFor: ['build-frontend', 'deploy-backend']

# ── Secrets available to build steps ──────────────────────────────────────────
availableSecrets:
  secretManager:
    - versionName: projects/smart-placement-prod/secrets/firebase-ci-token/versions/latest
      env: 'FIREBASE_TOKEN'

# ── Images pushed to Artifact Registry ────────────────────────────────────────
images:
  - 'asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/smart-placement-prod/services/backend-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '1200s'
